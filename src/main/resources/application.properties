spring.application.name=library
# Carga .env si existe; las variables de entorno reales tienen prioridad sobre él
spring.config.import=optional:file:.env[.properties]

# Conexión desde .env o el entorno; los valores por defecto son solo para desarrollo local
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mydatabase}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.mvc.problem-details.enabled=true
# Detrás de un proxy, las URLs absolutas (p. ej. de imágenes) usan el host público de X-Forwarded-*
server.forward-headers-strategy=framework

# Dónde se guardan las imágenes: local (disco) o s3
library.storage.type=${STORAGE_TYPE:local}
library.storage.images-dir=data/images
# Las credenciales de AWS NO van aquí: se leen de AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY, ~/.aws o el rol IAM
library.storage.s3.bucket=${S3_BUCKET:}
library.storage.s3.region=${AWS_REGION:}
library.storage.s3.prefix=images/
# Solo para MinIO/LocalStack; vacío en AWS
library.storage.s3.endpoint=${S3_ENDPOINT:}
library.storage.s3.path-style=${S3_PATH_STYLE:false}
library.storage.s3.presigned-url-ttl=1h
